<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Zoe Sleep Logo - Spiral Crescent -->
  <defs>
    <mask id="outerCrescent">
      <circle cx="50" cy="50" r="45" fill="white" />
      <circle cx="62" cy="42" r="35" fill="black" />
    </mask>
    <mask id="innerCrescent">
      <circle cx="60" cy="48" r="25" fill="white" />
      <circle cx="70" cy="42" r="18" fill="black" />
    </mask>
  </defs>
  <!-- Outer crescent moon -->
  <circle cx="50" cy="50" r="45" fill="#38A5B0" mask="url(#outerCrescent)" />
  <!-- Inner spiral crescent -->
  <circle cx="60" cy="48" r="25" fill="#38A5B0" mask="url(#innerCrescent)" />
</svg>
